listen:
  interface: br-test
  ip: 192.168.100.1
  dhcp_port: 67
  tftp_port: 69
  http_port: 80
  ironic_port: 6385

dhcp:
  subnet: 192.168.100.0/24
  gateway: 192.168.100.1
  dns: [8.8.8.8, 1.1.1.1]
  lease_time: 12h
  # Dynamic DHCP leases and declined/conflict addresses are persisted here so
  # autopxe does not re-issue occupied addresses after restart. Use
  # `autopxe -config /etc/autopxe/config.yaml -clear-leases` to clear it.
  lease_file: /var/lib/autopxe/leases.json
  # domain_name (option 15) and search_domains (option 119) are auto-derived
  # from dns.domain when DNS is enabled; uncomment to override.
  # domain_name: cluster.local
  # search_domains: [cluster.local, corp.local]
  pool:
    start: 192.168.100.100
    end: 192.168.100.200
  static:
    - mac: aa:bb:cc:dd:ee:01
      ip: 192.168.100.10
      hostname: node-01
    - mac: aa:bb:cc:dd:ee:02
      ip: 192.168.100.11
      hostname: node-02

dns:
  enabled: true                    # opt-in; binds to listen.ip:53 by default
  # listen: 192.168.100.1:53       # override host:port if needed
  domain: cluster.local            # appended to bare hostnames (e.g. node-01 → node-01.cluster.local)
  upstream:                        # default forwarder for unmatched queries
    - 8.8.8.8:53
    - 1.1.1.1
  wildcards:                       # per-suffix forwarders, longest match wins
    - suffix: corp.local
      upstream: [10.0.0.1:53]
    - suffix: lan
      upstream: [192.168.1.1]
  static:                          # always-resolve fixed records
    - { name: gateway,   ip: 192.168.100.1 }
    - { name: registry,  ip: 192.168.100.20 }
  register_deployed: true          # auto-resolve dhcp.static[].hostname for deployed nodes
  ttl: 60                          # TTL (seconds) on locally-served records

ipa:
  kernel: /var/lib/autopxe/ipa.kernel
  initramfs: /var/lib/autopxe/ipa.initramfs
  download:
    base_uri: https://tarballs.opendev.org/openstack/ironic-python-agent/dib
    flavor: centos9
    branch: master
    cache_dir: /var/lib/autopxe/cache

deploy:
  image: /var/lib/autopxe/images/cluster-rootfs.qcow2
  image_type: whole
  disk_format: qcow2
  root_mb: 51200

ironic:
  heartbeat_timeout: 300

# Persistent state file. After a node deploys successfully, its MAC is
# recorded here and subsequent PXE attempts from that MAC are suppressed
# (DHCP returns an IP but no boot file). Use `-forget <MAC>`,
# `-forget-all`, or `-list-deployed` to manage this file.
state_file: /var/lib/autopxe/state.json

config_drive:
  user_data: |
    #cloud-config
    user:
      name: root
      lock_passwd: false
    ssh_pwauth: true
    disable_root: false
    apt:
      preserve_sources_list: true
    prefer_fqdn_over_hostname: true
