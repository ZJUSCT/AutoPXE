name: pxe-cluster

services:
  ipxe-builder:
    image: pxe-cluster/ipxe-builder
    build: ./docker/ipxe-builder
    volumes:
      - tftpboot:/output

  ipa-downloader:
    image: pxe-cluster/ipa-downloader
    build: ./docker/ipa-downloader
    volumes:
      - webroot:/output
    environment:
      - IPA_FLAVOR=${IPA_FLAVOR:-centos9}
      - IPA_BRANCH=${IPA_BRANCH:-master}
      - IPA_BASEURI=${IPA_BASEURI:-https://tarballs.opendev.org/openstack/ironic-python-agent/dib}

  dnsmasq:
    image: pxe-cluster/dnsmasq
    build: ./docker/dnsmasq
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - tftpboot:/var/lib/tftpboot
    environment:
      - DNSMASQ_INTERFACE=${DNSMASQ_INTERFACE:-br-test}
      - LISTEN_ADDRESS=${LISTEN_ADDRESS:-192.168.100.1}
      - DHCP_RANGE=${DHCP_RANGE:-192.168.100.100,192.168.100.200,255.255.255.0,12h}
    depends_on:
      ipxe-builder:
        condition: service_completed_successfully

  nginx:
    image: pxe-cluster/nginx
    build: ./docker/nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - webroot:/srv
      - ./config/boot.ipxe:/srv/boot.ipxe:ro
      - ${IMAGES_DIR:-./images}:/srv/images:ro
    depends_on:
      ipa-downloader:
        condition: service_completed_successfully

  fakonic:
    image: pxe-cluster/fakonic
    build: ./docker/fakonic
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/fakonic.json:/etc/fakonic/config.json:ro

volumes:
  tftpboot:
  webroot:
