events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /srv;

        location / {
            autoindex on;
        }

        location /images/ {
            autoindex on;
            client_max_body_size 0;
        }
    }
}
