# Bind to the provisioning interface only
bind-interfaces
listen-address={{LISTEN_ADDRESS}}

# Disable DNS
port=0

# DHCP configuration
dhcp-range={{DHCP_RANGE}}
dhcp-option=3,{{GATEWAY_IP}}
dhcp-option=6,{{DNS_SERVER}}

# TFTP server
enable-tftp
tftp-root=/var/lib/tftpboot

# PXE boot: detect client architecture and serve appropriate firmware
# BIOS / legacy x86 PC
dhcp-match=set:bios-x86,option:client-arch,0
# EFI x86-64
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9

# Boot file selection based on architecture
dhcp-boot=tag:bios-x86,undionly.kpxe
dhcp-boot=tag:efi-x86_64,snponly.efi
dhcp-boot=undionly.kpxe
